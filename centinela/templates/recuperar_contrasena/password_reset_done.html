{% extends 'base.html' %}

{% block title %}Email Enviado{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <i class="bi bi-envelope-check text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h3 class="mb-3">¡Email Enviado!</h3>
                    <p class="text-muted mb-4">
                        Hemos enviado las instrucciones para restablecer tu contraseña a tu correo electrónico.
                    </p>
                    <p class="text-muted mb-4">
                        Si no recibes el correo en unos minutos, revisa tu carpeta de spam.
                    </p>
                    <a href="{% url 'auth_view' %}" class="btn btn-primary">
                        <i class="bi bi-arrow-left me-2"></i>Volver al Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
