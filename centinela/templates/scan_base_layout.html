<!-- Tailwind no lo importo porque esta en index.html -->
{% load static %}
{% block extra_head %}
<script>
    window.Visuals = {}; // espacio de nombres global para gráficos
    window.Modulosdata = {}; // espacio de nombres global para datos de módulos (para integración con IA)
    window.escaneoId = "{{ escaneo.id|default:'' }}"; // ID del escaneo actual
</script>

<!-- Chart.js desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- cargamos los scripts de gráficos -->
<script src="{% static 'js/charts/dns.js' %}"></script>
<script src="{% static 'js/charts/dorks.js' %}"></script>
<script src="{% static 'js/charts/headerhttp.js' %}"></script>
<script src="{% static 'js/charts/nmap.js' %}"></script>
<script src="{% static 'js/charts/ssl.js' %}"></script>
<script src="{% static 'js/charts/whois.js' %}"></script>

<!-- cargamos el script de análisis IA -->
<script src="{% static 'js/analisis_ia.js' %}"></script>

<!-- manejo botones explicaciones breves -->
<script src="{% static 'js/manejoBtnExp.js' %}"></script>

<!-- Estilos opcionales para animación -->
<style>
.icon-visit {
  transition: color 0.25s ease, transform 0.25s ease;
}

.icon-visit:hover {
  color: #0d6efd; /* Azul Bootstrap */
  transform: translateY(-2px);
}
</style>

{% endblock %}



{% if escaneo %}
<!-- Header con información del escaneo -->
<div id="header-escaneo" class="container-fluid bg-dark border-bottom border-secondary rounded-3 shadow-sm py-3 px-4 my-3">

  <div class="row align-items-center g-3">

    <!-- Información principal -->
    <div class="col-12 col-md-6 d-flex align-items-start gap-3 text-light">
      <div class="flex-grow-1">
        <span class="fw-semibold text-white d-block fs-5 mb-1">Escaneo #{{ escaneo.id }}</span>
        <span class="text-white fw-semibold d-block fs-5">
          Objetivo: <span class="fw-bold fs-5 text-success">{{ escaneo.objetivo }}</span>
          <a href="https://{{ escaneo.objetivo }}" rel="noopener noreferrer" target="_blank">
            <i class="bi bi-box-arrow-in-up-right text-white text-decoration-none fs-4 icon-visit"
                 style="font-size: 1.2rem;"
                 data-bs-toggle="tooltip"
                 data-bs-placement="top"
                 title="Visitar sitio escaneado"
                 ></i>
        </a>
        </span>
        
        
      </div>
    </div>

    <!-- Estado del escaneo -->
    <div class="col-6 col-md-3 text-md-end text-light">
      <span class="fw-semibold d-block text-white fs-5">Estado</span>
      <span id="escaneo-estado" class="fw-semibold fs-5
        {% if escaneo.estado == 'completado' %}text-success
        {% elif escaneo.estado == 'en_proceso' %}text-warning
        {% else %}text-danger{% endif %}">
        {{ escaneo.estado|capfirst }}
      </span>
    </div>

    <!-- Botón de acción -->
    <div class="col-6 col-md-3 text-md-end" id="btn-informe">
      <a href="{% url 'scan_report_view' escaneo.id %}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-3 py-2 fs-6 fw-bold">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5V13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.6a.5.5 0 0 1 1 0V13a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V10.4a.5.5 0 0 1 .5-.5z"/>
          <path d="M7.646 10.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 1 0-.708-.708L8.5 9.293V1.5a.5.5 0 0 0-1 0v7.793L5.354 7.146a.5.5 0 1 0-.708.708l3 3z"/>
        </svg>
        Descargar informe
      </a>
    </div>

  </div>
</div>
{% endif %}



<!-- Contenedor principal -->
<!-- 3 Columnas -->
<div class="row g-3 justify-content-center" id="grid-modulos">
</div>


<script>

    const rutaModulos = {
        'dns': 'dns_visuals.html',
        'dorks': 'dorks_visuals.html',
        'headers': 'headerhttp_visuals.html',
        'nmap': 'nmap_visuals.html',
        'ssl': 'ssl_visuals.html',
        'whois': 'whois_visuals.html',
    };

    const escaneoId = window.escaneoId; // ID del escaneo actual
    const nombreTargetElement = '#grid-modulos'; // Selector del contenedor donde se cargarán los módulos
    const estadoSpan = document.getElementById('escaneo-estado'); // Span donde se muestra el estado del escaneo

    // aca va el polling
    (function(){
        
        if (!escaneoId) return; // nada que vigilar

        const intervalMs = 1000; // poll cada 1s (ajusta si quieres)

        async function fetchResults(){
            try {
                // trae todos los modulos de este escaneo
                const resp = await fetch(`resultadosmodulos/?escaneo_id=${escaneoId}`, {
                    credentials: 'same-origin', // usa session auth
                    headers: { 'Accept': 'application/json' }
                });
                if (!resp.ok) {
                    console.error('API error', resp.status);
                    return;
                }
                const data = await resp.json(); // array de resultados

                if (!Array.isArray(data) || data.length === 0) {
                    console.warn("No se recibieron módulos todavía");
                    return;
                }
                console.log("Resultados recibidos:", data);
                console.log("Modulo recibido:", data[0].nombre_modulo, "→ ruta:", rutaModulos[data[0].nombre_modulo]);

                // 👉 recorrer todos los módulos
                data.forEach(mod => {
                    const ruta = rutaModulos[mod.nombre_modulo];
                    if (!ruta) {
                        console.warn("No hay ruta definida para módulo:", mod.nombre_modulo);
                        return;
                    }
                    console.log("Modulo: ", mod)
                    // Si ya existe el bloque de ese módulo, lo actualizamos en vez de volverlo a crear
                    if (document.querySelector(`#mod-${mod.id}`)) {
                        console.log(`Módulo ${mod.nombre_modulo} ya renderizado, se actualiza estado.`);
                    } else if (mod.estado === "completado" && mod.resultado && Object.keys(mod.resultado).length > 0) {
                        console.log(`✅ Cargando módulo ${mod.nombre_modulo} → ${ruta}`);
                        loadHTML(ruta, nombreTargetElement, mod);

                    } else {
                        console.log(`⏳ Módulo ${mod.nombre_modulo} aún en proceso, esperando resultados...`);
                    }
                });     
                // Actualizo el estado general del escaneo
                await actualizarEstado();
                
                // Si ya terminaron todos los módulos del escaneo (éxito o error), dejo de consultar al servidor.
                const allFinished = data.length > 0 && data.every(r => r.estado === 'completado' || r.estado === 'error');
                if (allFinished) {
                    console.log("Todos los módulos han finalizado, deteniendo polling.");
                    clearInterval(poller);
                    await actualizarEstado();
           
                }

            } catch (err) {
            console.error('fetch error', err);
            }
        }

        fetchResults(); // llamada inicial inmediata
        const poller = setInterval(fetchResults, intervalMs);
    
    })();



    //AUXILIARES
    // Funcion para actualizar estado de escaneo en el header
    async function actualizarEstado() {
        try {
            const resp = await fetch(`/escaneo/${escaneoId}/status/`);
            const data = await resp.json();

            const btnInforme = document.getElementById("btn-informe");

            estadoSpan.textContent = data.estado;
            estadoSpan.classList.remove('text-success', 'text-warning', 'text-danger');

            if(data.estado === 'completado') {
                estadoSpan.classList.add('text-success');
                btnInforme.classList.remove('d-none');
            }
            else if(data.estado === 'en_proceso') estadoSpan.classList.add('text-warning');
            else estadoSpan.classList.add('text-danger');
        } catch(err) {
            console.error('Error actualizando estado del escaneo:', err);
        }
    }


    // Función para cargar HTML externo y traer los visuals de cada modulo
    async function loadHTML(file, targetElement, data) {
        try {
            // Fetch del archivo HTML del módulo
            const response = await fetch(`modules/${file}`);
            const html = await response.text();

            // Crear un contenedor dinámico para este módulo
            const wrapper = document.createElement("div");
            wrapper.classList.add('col-12', 'col-md-4'); // 3 columnas en md y superiores, 1 columna en small
            wrapper.id = `mod-${data.id}`; // id único por módulo
            wrapper.innerHTML = html;

            // Establecer el nombre del módulo en el header
            const moduleNameSpan = wrapper.querySelector('.module_name');
            moduleNameSpan.textContent = data.nombre_modulo.toUpperCase();

            // Establecer el nombre del módulo en el botón de análisis IA
            const iaButton = wrapper.querySelector('.btn-analisis-ia');
            iaButton.setAttribute('data-module-name', data.nombre_modulo);

            // Agregarlo al grid (appendChild en vez de innerHTML =)
            document.querySelector(targetElement).appendChild(wrapper);

            // 🎯 INICIALIZAR TOOLTIPS PARA ESTE MÓDULO
            initializeTooltipsForModule(wrapper, data.nombre_modulo);

            // Mostrar analisis IA si ya existe, no antes ya que primero se debe generar la card
            if (data.analisis_ia) {
                console.log("Mostrando análisis IA existente para módulo:", data.nombre_modulo);
                console.log(data.analisis_ia);

                const btn_ia = wrapper.querySelector('.btn-analisis-ia');
                // Buscar la card del módulo
                const moduleCard = btn_ia.closest('.bg-light');
                const containerAnalisis = moduleCard.querySelector('.container-analisis-ia');

                // Buscar elementos dentro de la card
                const badge = containerAnalisis.querySelector('.analisis-badge');
                const texto = containerAnalisis.querySelector('.analisis-texto');

                // Rellenar con datos del análisis IA
                badge.textContent = `Riesgo ${data.analisis_ia.riesgo}`;
                badge.style.backgroundColor = data.analisis_ia.color;
                texto.textContent = data.analisis_ia.explicacion;

                containerAnalisis.classList.remove('d-none');
                containerAnalisis.classList.add('alert-info');

                // Restaurar botón
                btn_ia.disabled = true;
                btn_ia.innerHTML = '✅ Analizado';
            }

            setTimeout(() => {
                // Llamo a la función del módulo que inicializa los gráficos
                const modulo = data.nombre_modulo; // ej "dns"
                window.Modulosdata[modulo] = data.resultado; // guardo los datos para posible uso por IA

                console.log(`Buscando función de inicialización para módulo: ${modulo}`);
                if (window.Visuals && typeof window.Visuals[modulo] === 'function') { //Si puede acceder a windows.visuals y existe la función
                    console.log(`Iniciando gráficos para módulo ${modulo}`, data.resultado);
                    window.Visuals[modulo](data.resultado); // paso los datos JSON
                } else {
                    console.warn(`No se encontró función de inicialización para módulo ${modulo}`);
                }
                
            }, 100);

        } catch (error) {
            console.error('Error cargando el archivo:', error);
        }
    }
    
</script>
