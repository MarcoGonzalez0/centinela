<header class="bg-dark text-white shadow-lg">
    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center">
            
            <!-- Título o logo -->
            <div class="d-flex align-items-center gap-3">
                {% block header_title %}
                {% endblock %}
            </div>

            <!-- Navegación principal (oculta en mobile) -->
            <nav class="d-none d-md-flex gap-3 bg-primary bg-gradient rounded-pill shadow-sm py-2 px-3">
                {% block header_links %}
                {% endblock %}
            </nav>

            <!-- Acciones de usuario -->
            <div class="d-flex align-items-center gap-3">
                {% block user_actions %}
                {% endblock %}
            </div>

        </div>
    </div>
</header>

<style>
    /* --- Estilos adicionales para darle vida --- */
    nav a.nav-link {
        transition: color 0.25s ease, transform 0.25s ease;
    }

    nav a.nav-link:hover {
        color: #0d6efd; /* Azul bootstrap */
        transform: translateY(-2px);
    }

    /* Subrayado animado */
    nav a.nav-link::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 0;
        height: 2px;
        background-color: #0d6efd;
        transition: all 0.3s ease;
        transform: translateX(-50%);
    }

    nav a.nav-link:hover::after {
        width: 60%;
    }

    /* Pequeña animación de aparición */
    nav {
        animation: fadeInDown 0.6s ease forwards;
        opacity: 0;
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
